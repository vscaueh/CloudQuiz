name: CloudQuiz - testes e build
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  frontend-and-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Testar interface e Back4App real
        run: |
          test -n "$CLOUDQUIZ_TEST_USERNAME"
          test -n "$CLOUDQUIZ_TEST_PASSWORD"
          npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
          VITE_PARSE_APP_ID: ${{ vars.VITE_PARSE_APP_ID }}
          VITE_PARSE_JAVASCRIPT_KEY: ${{ vars.VITE_PARSE_JAVASCRIPT_KEY }}
          VITE_PARSE_SERVER_URL: https://parseapi.back4app.com
          CLOUDQUIZ_TEST_USERNAME: ${{ secrets.CLOUDQUIZ_TEST_USERNAME }}
          CLOUDQUIZ_TEST_PASSWORD: ${{ secrets.CLOUDQUIZ_TEST_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
