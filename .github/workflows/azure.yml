name: CloudQuiz - publicar no Azure
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CloudQuiz - testes e build']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_PARSE_APP_ID: ${{ vars.VITE_PARSE_APP_ID }}
          VITE_PARSE_JAVASCRIPT_KEY: ${{ vars.VITE_PARSE_JAVASCRIPT_KEY }}
          VITE_PARSE_SERVER_URL: https://parseapi.back4app.com
          REQUIRE_CLOUD_CONFIG: '1'
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
